# Photorealism Plugin 0.10.1 - Automatic Spatial/Temporal Startup
# ETS2/ATS 1.60 / Windows x64 / Direct3D 11 / Proton-DXVK
# Home: ativa/desativa o efeito
# End: recarga manual opcional deste arquivo, shaders e descoberta depth
# Insert: normal+SSAO -> raw -> reversed-Z realcado -> distancia linear ->
#         normais reconstruidas -> mascara SSAO -> bloom isolado ->
#         normal+SSAO

[plugin]
enabled=true

# Diagnostico espacial independente da calibracao visual.
# O modelo reversed-Z de plano distante infinito usa: distancia = near/depth.
[depth.0.6.4]
near_plane=0.1
preview_distance=50.0
vertical_fov=60.0

# Primeira camada de iluminacao espacial. Aplicada depois do visual aprovado.
[module.ssao.0.7.0]
enabled=true
radius=0.8
intensity=0.28
bias=0.04
fade_start=30.0
fade_end=70.0
edge_rejection=1.5

# Refinamento cumulativo do SSAO aprovado. Completa os dois aneis com
# 16 amostras e reduz a oclusao sobre fontes e reflexos muito luminosos.
[module.ssao_refinement.0.8.0]
enabled=true
highlight_start=0.55
highlight_end=0.95
highlight_ao_floor=0.35

# Perfil de cabine/interior. O ETS2 nao fornece um marcador semantico de
# camera; por isso este perfil atua suavemente sobre geometria proxima e o
# perfil exterior 0.8.0 volta integralmente a partir de near_end.
[module.ssao_interior.0.9.0]
enabled=true
near_start=2.0
near_end=8.0
radius=0.45
intensity=0.20
bias=0.05
edge_rejection=1.75

# Resolve temporal cumulativo aplicado depois do visual e do SSAO. O historico
# e limitado pela vizinhanca atual e rejeitado quando cor ou depth mudam, para
# reduzir cintilacao sem arrastar geometria, farois, chuva ou reflexos.
[module.temporal.0.10.0]
enabled=true
history_weight=0.65
depth_rejection=0.02
color_rejection=0.08

# Perfil de referencia preservado da versao 0.1.2.
[base.0.1.2]
enabled=true
temperature=6500
exposure=-0.09
contrast=0.98
saturation=0.95
vibrance=-0.05
shadows=0.04
highlights=-0.05
blacks=0.05
whites=0.03
local_contrast=0.12
# Era -0.01, e somado aos dois deltas dava -0.06 efetivo: empurrava os pretos
# para baixo, contra o alvo. 0.05 zera a soma das tres camadas e deixa o piso
# por conta de black_lift, que e quem sabe fazer isso.

sharpness=0.18
vignette=0.04
# Curva de tom, 0.14.0. Ate a 0.13.3 o shader nao tinha curva nenhuma: os
# altos batiam no saturate() final e os baixos esmagavam em zero.
#
# black_lift e o piso do preto, em linear, e desde a 0.17.1 sao TRES numeros.
#
# Ate a 0.17.0 era um so, 0.0027, tirado do p1 da LUMA das referencias. A
# magnitude estava certa e a cor nao: o p1 da luma esconde que o canal R fica
# muito abaixo dele. As quatro capturas da 0.17.0 sairam com piso 8/8/8 e
# 9/9/9, R/G e B/G exatamente 1,000, porque um piso escalar e acromatico por
# construcao.
#
# 0.17.2: os numeros da 0.17.1 vinham do 1% mais escuro das referencias SEM
# corrigir o vies do grao. A cauda e escolhida ordenando por luminancia, que e
# 72% G, entao so o canal G desce -- medido por injecao, -0,18 / -1,83 / +0,43
# codigos com grao de desvio 2,1. Corrigidas, as tres de tempo claro tem piso
# 3,35/6,53/6,03, 2,86/6,15/6,22 e 4,78/7,84/7,82 em 255.
#
# Estes tres sao a mediana por canal dessas tres, convertida para linear. As de
# neblina entram como delta em rain_overcast, e nao puxando a base.
#
# A forma escalar antiga (black_lift=0.0027) continua sendo aceita e escreve os
# tres canais iguais -- ou seja, reproduz exatamente o piso acromatico que esta
# versao corrige.
#
# highlight_rolloff e o ombro: acima do joelho os altos comprimem para 1 em vez
# de bater nele. tint e o eixo verde-magenta, que nao existia -- temperature so
# troca R contra B, e as cinco referencias tem G como canal mais alto.
black_lift_r=0.001017
black_lift_g=0.001982
black_lift_b=0.001888
highlight_rolloff=0.35
tint=0.35

# Primeira calibracao visual. Os valores abaixo sao deltas somados a base.
[module.visual.0.2.0]
enabled=true
temperature_delta=-100
exposure_delta=0.05
contrast_delta=0.08
saturation_delta=0.03
vibrance_delta=0.09
shadows_delta=0.04
highlights_delta=-0.09
blacks_delta=-0.04
whites_delta=0.01
local_contrast_delta=0.06
sharpness_delta=0.04
vignette_delta=-0.005
# Os tres da 0.14.0 entram neutros aqui: a primeira rodada move so a base,
# para o A/B em jogo ter uma variavel de cada vez.
black_lift_r_delta=0.0
black_lift_g_delta=0.0
black_lift_b_delta=0.0
highlight_rolloff_delta=0.0
tint_delta=0.0

# Chuva e tempo nublado. Esta camada complementa a base e o modulo 0.2.0.
[module.rain_overcast.0.3.0]
enabled=true
temperature_delta=0.0
exposure_delta=0.01
contrast_delta=0.01
saturation_delta=-0.01
vibrance_delta=0.01
shadows_delta=0.02
highlights_delta=-0.04
blacks_delta=-0.01
whites_delta=0.04
local_contrast_delta=0.06
sharpness_delta=-0.02
vignette_delta=-0.005
# 0.17.2. Esta camada esta SEMPRE somada -- nao ha deteccao de clima -- entao
# quem precisa cair no alvo e a SOMA das tres, nao a base sozinha. O alvo da
# soma e a mediana por canal das cinco referencias corrigidas do vies do grao:
# 4,78/7,84/7,82 em 255.
#
# A soma nao e a conversao direta desse alvo. O piso medido numa captura e lift
# mais o que a cena poe por cima, cerca de 0,6 codigo, entao os tres numeros
# saem de resolver o lift que POE a cauda no alvo -- invertendo a etapa afim do
# shader pixel a pixel nas doze capturas da 0.17.1. Da 0,001398/0,002480/
# 0,002268, e estes deltas completam a base ate la. Mirar a soma nas duas de
# neblina (7,6/9,7/10,8) poria o piso permanente no extremo da faixa.
black_lift_r_delta=0.000381
black_lift_g_delta=0.000498
black_lift_b_delta=0.000380
highlight_rolloff_delta=0.0
# A referencia de tempo encoberto e a mais verde das cinco (G/R = 1,21 contra
# 1,11 da de dia claro), entao esta camada acrescenta tint.
tint_delta=0.15

# Perfil efetivo com todas as camadas ativas:
# temperature=6400, exposure=-0.03, contrast=1.07, saturation=0.97
# vibrance=0.05, shadows=0.10, highlights=-0.18, blacks=-0.06
# whites=0.08, local_contrast=0.24, sharpness=0.20, vignette=0.03
# black_lift=0.001398/0.002480/0.002268, que sai 5/8/7 em 255 -- a mediana por
# canal das cinco referencias corrigida do vies do grao. A base sozinha daria
# 0.001017/0.001982/0.001888, o piso de tempo claro.

# Politica do AA/TAA nativo do jogo, escrita no config.cfg do ETS2/ATS no
# bootstrap. Ate a 0.12.1 o plugin zerava tudo para assumir o AA sozinho -- mas
# com o TAA nativo desligado o Prism3D nao precisa ler o depth num shader e o
# cria sem BIND_SHADER_RESOURCE. Sem depth legivel, SSAO, resolve temporal e
# resolve temporal ficam sem fonte, que foi o que travou a validacao da
# 0.12.1.
#
# manage=false faz o plugin nao tocar no config.cfg do jogo. O original fica em
# config.photorealism-native-aa.backup.cfg, ao lado dele.
[native_aa.0.12.2]
manage=true
r_aa=6
r_taa_tuning=4
r_taa_luma_sharpen=1.5
r_taa_modulated_drr_strength=1.2

# Bloom. O glare que as referencias do ATS mostram e que nenhum ajuste por
# pixel alcanca: exposicao, contraste e curva de tom mapeiam valor para valor
# no mesmo lugar, e bloom e energia atravessando dezenas de pixels.
#
# ATENCAO -- ESTE MODULO E LICENCA ARTISTICA, E NAO O ALVO MEDIDO.
# As cinco referencias do ATS foram medidas na 0.17.0 e o resultado contradiz
# o modulo: elas NAO tem bloom. Toda borda entre muito claro e muito escuro
# esta nitida -- o quadro do para-brisa contra o ceu, as nuvens contra a
# cabine, o capo branco contra o painel -- e o perfil de borda em resolucao
# cheia mostra o lado escuro plano ate a transicao, SEM CAUDA, que e justamente
# a assinatura que bloom deixaria. De noite os mostradores acesos nao iluminam
# nada em volta.
#
# O que as referencias tem sao RAIOS DE SOL: estriados radiais saindo do sol,
# que sao direcionais e que uma piramide gaussiana nao produz. Isso e a 0.18.0,
# e reaproveita o bright-pass e a piramide daqui.
#
# O modulo fica ligado por decisao do usuario, com intensidade baixa e ciente
# disso. Subir `intensity` afasta do alvo medido em vez de aproximar.
#
# threshold e knee estao em sRGB 0-1, a mesma unidade que grade_report.py
# imprime dividida por 255. 0.85 e o codigo 217, acima do p95 das cinco
# referencias (117 a 212): assim o bloom pega o disco do sol, o topo das nuvens
# e o realce do capo, e NAO o ceu. Este numero e medido; os outros tres nao.
#
# radius e FRACAO DA ALTURA da tela, e por isso vale em qualquer resolucao. Ele
# escolhe quantos niveis a piramide tem -- o alcance do glow e a resolucao do
# nivel mais grosseiro, nao o tamanho de um kernel.
[module.bloom.0.17.0]
enabled=true
threshold=0.85
knee=0.06
intensity=0.02
radius=0.03

# Observador de cena. NAO ALTERA UM PIXEL -- ele so mede e escreve no log.
#
# Existe porque a calibracao de cor de hoje e a media de condicoes que nao se
# parecem. As cinco referencias, medidas em 0.18.0, sao cinco climas/horarios
# diferentes:
#
#   ref        condicao          ceu R/B  mediana  p90-p10  saturacao
#   23-47-51   anoitecer          0,906     12,6     55,2     0,499
#   23-33-14   encoberto          0,967     18,0    153,4     0,422
#   11-12-25   neblina            1,004     17,9    108,3     0,311
#   11-12-15   sol baixo          1,006     25,8    100,5     0,288
#   15-56-22   dia claro          0,942     39,5    170,3     0,242
#
# Essas quatro colunas separam as cinco: ceu R/B da o eixo quente-frio,
# mediana da a hora, p90-p10 da o veu, saturacao desempata encoberto de
# neblina. Um `tint` unico nao tem como acertar as cinco ao mesmo tempo -- e e
# por isso que ele hoje esta em 0,50, entre o alvo de dia claro e o de
# encoberto, errando os dois.
#
# ATENCAO: os numeros da tabela sao do ATS e sao SAIDA. Servem para descrever
# as condicoes, nunca como limiar. O detector le o frame PRE-GRADE do ETS2, que
# e outro jogo, outra cena e outra iluminacao. Os limiares saem das linhas
# `Cena 0.18.0:` deste log, colhidas jogando ETS2 em tempos diferentes.
#
# interval_frames e a cadencia de amostragem; 30 sao ~0,5s a 60fps. Condicao de
# tempo muda em minutos, entao nao ha razao para amostrar mais rapido.
# log_seconds=0 desliga o registro periodico e mantem so a primeira medida.
[module.scene_observer.0.18.0]
enabled=true
interval_frames=30
log_seconds=30
