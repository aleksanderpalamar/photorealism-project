# Photorealism Plugin 0.10.1 - Automatic Spatial/Temporal Startup
# ETS2/ATS 1.60 / Windows x64 / Direct3D 11 / Proton-DXVK
# Home: ativa/desativa o efeito
# End: recarga manual opcional deste arquivo, shaders e descoberta depth
# Insert: normal+SSAO -> raw -> reversed-Z realcado -> distancia linear -> normais -> mascara SSAO -> normal+SSAO

[plugin]
enabled=true

# Diagnostico espacial independente da calibracao visual.
# O modelo reversed-Z de plano distante infinito usa: distancia = near/depth.
[depth.0.6.4]
near_plane=0.1
preview_distance=50.0
vertical_fov=60.0

# Primeira camada de iluminacao espacial. Aplicada depois do visual aprovado.
[module.ssao.0.7.0]
enabled=true
radius=0.8
intensity=0.28
bias=0.04
fade_start=30.0
fade_end=70.0
edge_rejection=1.5

# Refinamento cumulativo do SSAO aprovado. Completa os dois aneis com
# 16 amostras e reduz a oclusao sobre fontes e reflexos muito luminosos.
[module.ssao_refinement.0.8.0]
enabled=true
highlight_start=0.55
highlight_end=0.95
highlight_ao_floor=0.35

# Perfil de cabine/interior. O ETS2 nao fornece um marcador semantico de
# camera; por isso este perfil atua suavemente sobre geometria proxima e o
# perfil exterior 0.8.0 volta integralmente a partir de near_end.
[module.ssao_interior.0.9.0]
enabled=true
near_start=2.0
near_end=8.0
radius=0.45
intensity=0.20
bias=0.05
edge_rejection=1.75

# Resolve temporal cumulativo aplicado depois do visual e do SSAO. O historico
# e limitado pela vizinhanca atual e rejeitado quando cor ou depth mudam, para
# reduzir cintilacao sem arrastar geometria, farois, chuva ou reflexos.
[module.temporal.0.10.0]
enabled=true
history_weight=0.65
depth_rejection=0.02
color_rejection=0.08

# Perfil de referencia preservado da versao 0.1.2.
[base.0.1.2]
enabled=true
temperature=6500
exposure=-0.09
contrast=0.98
saturation=0.95
vibrance=-0.05
shadows=0.04
highlights=-0.05
blacks=-0.01
whites=0.03
local_contrast=0.12
sharpness=0.18
vignette=0.04

# Primeira calibracao visual. Os valores abaixo sao deltas somados a base.
[module.visual.0.2.0]
enabled=true
temperature_delta=-100
exposure_delta=0.05
contrast_delta=0.08
saturation_delta=0.03
vibrance_delta=0.09
shadows_delta=0.04
highlights_delta=-0.09
blacks_delta=-0.04
whites_delta=0.01
local_contrast_delta=0.06
sharpness_delta=0.04
vignette_delta=-0.005

# Chuva e tempo nublado. Esta camada complementa a base e o modulo 0.2.0.
[module.rain_overcast.0.3.0]
enabled=true
temperature_delta=0.0
exposure_delta=0.01
contrast_delta=0.01
saturation_delta=-0.01
vibrance_delta=0.01
shadows_delta=0.02
highlights_delta=-0.04
blacks_delta=-0.01
whites_delta=0.04
local_contrast_delta=0.06
sharpness_delta=-0.02
vignette_delta=-0.005

# Perfil efetivo com todas as camadas ativas:
# temperature=6400, exposure=-0.03, contrast=1.07, saturation=0.97
# vibrance=0.05, shadows=0.10, highlights=-0.18, blacks=-0.06
# whites=0.08, local_contrast=0.24, sharpness=0.20, vignette=0.03
