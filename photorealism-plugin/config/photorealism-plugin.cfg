# Photorealism Plugin 0.10.1 - Automatic Spatial/Temporal Startup
# ETS2/ATS 1.60 / Windows x64 / Direct3D 11 / Proton-DXVK
# Home: ativa/desativa o efeito
# End: recarga manual opcional deste arquivo, shaders e descoberta depth
# Insert: normal+SSAO -> raw -> reversed-Z realcado -> distancia linear -> normais -> mascara SSAO -> normais RTGI -> normal+SSAO
# Page Up: liga/desliga o RTGI em tempo real, para comparacao A/B

[plugin]
enabled=true

# Diagnostico espacial independente da calibracao visual.
# O modelo reversed-Z de plano distante infinito usa: distancia = near/depth.
[depth.0.6.4]
near_plane=0.1
preview_distance=50.0
vertical_fov=60.0

# Primeira camada de iluminacao espacial. Aplicada depois do visual aprovado.
[module.ssao.0.7.0]
enabled=true
radius=0.8
intensity=0.28
bias=0.04
fade_start=30.0
fade_end=70.0
edge_rejection=1.5

# Refinamento cumulativo do SSAO aprovado. Completa os dois aneis com
# 16 amostras e reduz a oclusao sobre fontes e reflexos muito luminosos.
[module.ssao_refinement.0.8.0]
enabled=true
highlight_start=0.55
highlight_end=0.95
highlight_ao_floor=0.35

# Perfil de cabine/interior. O ETS2 nao fornece um marcador semantico de
# camera; por isso este perfil atua suavemente sobre geometria proxima e o
# perfil exterior 0.8.0 volta integralmente a partir de near_end.
[module.ssao_interior.0.9.0]
enabled=true
near_start=2.0
near_end=8.0
radius=0.45
intensity=0.20
bias=0.05
edge_rejection=1.75

# Resolve temporal cumulativo aplicado depois do visual e do SSAO. O historico
# e limitado pela vizinhanca atual e rejeitado quando cor ou depth mudam, para
# reduzir cintilacao sem arrastar geometria, farois, chuva ou reflexos.
[module.temporal.0.10.0]
enabled=true
history_weight=0.65
depth_rejection=0.02
color_rejection=0.08

# Perfil de referencia preservado da versao 0.1.2.
[base.0.1.2]
enabled=true
temperature=6500
exposure=-0.09
contrast=0.98
saturation=0.95
vibrance=-0.05
shadows=0.04
highlights=-0.05
blacks=0.05
whites=0.03
local_contrast=0.12
# Era -0.01, e somado aos dois deltas dava -0.06 efetivo: empurrava os pretos
# para baixo, contra o alvo. 0.05 zera a soma das tres camadas e deixa o piso
# por conta de black_lift, que e quem sabe fazer isso.

sharpness=0.18
vignette=0.04
# Curva de tom, 0.14.0. Ate a 0.13.3 o shader nao tinha curva nenhuma: os
# altos batiam no saturate() final e os baixos esmagavam em zero.
#
# black_lift e o piso do preto, em linear. 0.0027 leva o preto a 0.0027*12.92
# = 0.0349 em sRGB, ou 8,9 em 255 -- a faixa medida nas quatro referencias do
# ATS, que tem o 1% mais escuro entre 8 e 11. E o unico numero que sozinho
# separa aquele visual do nosso. Zero aqui e a 0.13.3 de volta.
#
# highlight_rolloff e o ombro: acima do joelho os altos comprimem para 1 em vez
# de bater nele. tint e o eixo verde-magenta, que nao existia -- temperature so
# troca R contra B, e as quatro referencias tem G como canal mais alto.
black_lift=0.0027
highlight_rolloff=0.35
tint=0.35

# Primeira calibracao visual. Os valores abaixo sao deltas somados a base.
[module.visual.0.2.0]
enabled=true
temperature_delta=-100
exposure_delta=0.05
contrast_delta=0.08
saturation_delta=0.03
vibrance_delta=0.09
shadows_delta=0.04
highlights_delta=-0.09
blacks_delta=-0.04
whites_delta=0.01
local_contrast_delta=0.06
sharpness_delta=0.04
vignette_delta=-0.005
# Os tres da 0.14.0 entram neutros aqui: a primeira rodada move so a base,
# para o A/B em jogo ter uma variavel de cada vez.
black_lift_delta=0.0
highlight_rolloff_delta=0.0
tint_delta=0.0

# Chuva e tempo nublado. Esta camada complementa a base e o modulo 0.2.0.
[module.rain_overcast.0.3.0]
enabled=true
temperature_delta=0.0
exposure_delta=0.01
contrast_delta=0.01
saturation_delta=-0.01
vibrance_delta=0.01
shadows_delta=0.02
highlights_delta=-0.04
blacks_delta=-0.01
whites_delta=0.04
local_contrast_delta=0.06
sharpness_delta=-0.02
vignette_delta=-0.005
black_lift_delta=0.0
highlight_rolloff_delta=0.0
# A referencia de tempo encoberto e a mais verde das quatro (G/R = 1,21 contra
# 1,11 da de dia claro), entao esta camada acrescenta tint.
tint_delta=0.15

# Perfil efetivo com todas as camadas ativas:
# temperature=6400, exposure=-0.03, contrast=1.07, saturation=0.97
# vibrance=0.05, shadows=0.10, highlights=-0.18, blacks=-0.06
# whites=0.08, local_contrast=0.24, sharpness=0.20, vignette=0.03

# Politica do AA/TAA nativo do jogo, escrita no config.cfg do ETS2/ATS no
# bootstrap. Ate a 0.12.1 o plugin zerava tudo para assumir o AA sozinho -- mas
# com o TAA nativo desligado o Prism3D nao precisa ler o depth num shader e o
# cria sem BIND_SHADER_RESOURCE. Sem depth legivel, SSAO, resolve temporal e
# RTGI ficam todos sem fonte, que foi o que travou a validacao da 0.12.1.
#
# manage=false faz o plugin nao tocar no config.cfg do jogo. O original fica em
# config.photorealism-native-aa.backup.cfg, ao lado dele.
[native_aa.0.12.2]
manage=true
r_aa=6
r_taa_tuning=0
r_taa_luma_sharpen=1.5
r_taa_modulated_drr_strength=0.0

# Screen-Space Ray-Traced Global Illumination. Reaproveita depth linearizado,
# normais reconstruidas, scene color e historico temporal ja existentes para
# aproximar luz indireta de curto/medio alcance -- o color bleeding que tira da
# cena o aspecto de CG. Roda antes do grading, para que exposure, contraste e
# LUT afetem tanto a luz direta quanto a indireta.
#
# Desde a 0.13.2 o GI e somado a cor de cena antes do grading. O modulo
# continua nascendo desligado porque o custo e real e o ruido ainda nao foi
# tratado -- Page Up liga em tempo real, para comparacao A/B. debug aceita
# normals, rays, hit_distance, raw_gi, temporal_gi, confidence e final; com o
# Insert na posicao 6, Page Down cicla as views sem editar este arquivo.
#
# A marcha e GEOMETRICA, nao de passo fixo. Ate a 0.12.1 o passo era
# (range_max-range_min)/max_steps = 1,21 m, e como a soma vem antes da primeira
# amostra, nada era amostrado entre 0,5 e 1,71 m -- a cabine inteira (banco
# ~0,5 m, painel e GPS ~0,7 m, para-brisa ~1 m) ficava num ponto cego. Com
# razao geometrica e range_min=0.10, seis das doze amostras caem na cabine e o
# exterior continua alcancando 15 m. NAO suba range_min de volta para 0.5 sem
# olhar tests/rtgi_config_test.cpp: a cobertura do interior e testada.
#
# hit_thickness virou TETO, e nao mais espessura fixa. A ambiguidade que a
# marcha introduz e o proprio comprimento do passo, entao a espessura usada e
# min(passo, hit_thickness): perto da ~0,05 m e impede a luz de vazar pelo
# painel; longe o teto impede que uma fatia de 5 m aceite qualquer coisa.
#
# max_indirect_luma e aplicado POR RAIO, antes da media: e rejeicao de firefly.
#
# sky_ambient NAO PODE VOLTAR A ZERO. Ele e a luz que um raio recebe quando
# escapa sem acertar nada, e ate a 0.13.2.1 valia 0.0 -- o que fazia o preto ser
# a resposta do shader para "nao sei". Dentro da cabine escapam todos os raios:
# toda normal reconstruida aponta para a camera, entao o hemisferio do painel e
# o ar entre ele e o olho do motorista. O resultado era painel preto chapado em
# pleno tunel iluminado, e sem nem granulado, porque quatro zeros tem media
# exatamente zero. Se o interior sair escuro demais, suba este valor; se a
# cabine ficar leitosa, desca. Zero nao e um ajuste, e o bug de volta.
#
# gi_intensity subiu de 0.15 para 0.6 na 0.13.3. Os dois sao multiplicadores e
# se empilhavam: sky_ambient*gi_intensity era o teto do que um raio escapado
# somava, e o raio tipico no painel ficava em ~0,008 linear -- cerca de 5
# niveis em 255 sobre uma superficie ja escura. O conserto da 0.13.2.1 existia
# e nao dava para ver.
[module.rtgi.0.12.0]
enabled=false
resolution_scale=2
ray_count=4
max_steps=12
range_min=0.10
range_max=15.0
gi_intensity=0.6
max_indirect_luma=4.0
sky_ambient=0.25
hit_thickness=0.5
normal_bias=0.05
debug=final

# Acumulacao temporal do GI, ativa desde a 0.13.3. Nao confundir com os
# homonimos de [module.temporal.0.10.0], que sao de outro passe.
#
# Nao ha reprojecao: o plugin roda no Present e nao tem matrizes de camera nem
# motion vectors, entao a historia e lida no mesmo pixel. Para o interior da
# cabine isso e exato -- painel, volante e bancos nao se movem em relacao a
# camera -- e e onde a acumulacao entrega tudo. Para a cena vista pelo
# para-brisa a historia e rejeitada em movimento, e o ruido volta ao nivel da
# 0.13.2.1. Isso e o desenho funcionando.
#
# history_weight e o teto de quanto do frame anterior entra. As tres rejeicoes
# sao multiplicadas, e qualquer uma delas zerada descarta a historia inteira.
# Sinal de que passou do ponto: rastro atras do que se move na tela. O recuo e
# baixar color_rejection, ou history_weight de 0.90 para 0.80.
#
# color_rejection foi 0.05 na 0.13.3, e era um erro. O termo compara o frame
# atual com o historico, e num buffer de GI a diferenca entre os dois E o ruido
# que a acumulacao existe para eliminar: com o corte em 0,05 a historia era
# descartada todo frame, justamente nas superficies escuras que mais
# precisavam dela. O clamp de vizinhanca 3x3 continua segurando outlier, e as
# rejeicoes de profundidade e normal continuam impedindo borrao -- nenhuma das
# duas depende deste termo.
history_weight=0.90
depth_rejection=0.015
normal_rejection=0.85
color_rejection=0.5
